rubric_notes: |
  Medium TP. The Suricata alert is Informational — taken alone, classic noise.
  Verdict requires the system to use the DNS summary (volume + entropy +
  qtype mix favoring TXT/NULL) AND the conn-summary showing the host has no
  other meaningful egress. A signature-only triage will misclassify this.
  This scenario tests the system's ability to reason about volume aggregates,
  not single events. It also tests the absence-of-other-egress signal (a
  positive observation, not a "no MISP hit" negative).

  Fidelity note (2026-08-26): the tunnel is planted as 65 RAW zeek.dns rows
  (unique variable-length base32 payload subdomains, measured mean label
  entropy 4.56, TXT/NULL-mixed), not just the pre-aggregated dns_summary doc.
  Same defect class as the m1 beacon: t_dns_entropy_scan aggregates raw
  event.dataset:zeek.dns rows under a min_queries floor (50 per registrable
  parent), so the summary-doc-only encoding returned parents_scanned == 0 and
  the flagship DNS scenario was invisible to the DNS analytic. The slice
  clears candidacy on the tool's decisive entropy_mean >= 4.2 arm — the arm
  built for exactly the case where extreme entropy precedes volume. The
  summary doc is kept for the single-alert triage path. b4 (the benign twin)
  plants a same-shaped raw slice that the same sweep scans and does NOT flag.
