<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="876" viewBox="0 0 1600 876" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker></defs>
<rect width="1600" height="876" fill="#0d1117"/>
<text x="32" y="40" font-size="22" font-weight="700" fill="#e6edf3">How this flows: from an alert or a sweep to an action in Security Onion</text>
<text x="32" y="62" font-size="13" fill="#8b949e">Two inputs enter on the left. Each box states what the thing is. Blue: the sweep path. Purple: the alert path and the investigation. Amber: what waits on you. Green: a loop back to observations.</text>
<text x="32" y="96" font-size="11" font-weight="700" fill="#58a6ff" letter-spacing="1">THE SWEEP PATH · EVERY HOUR</text>
<rect x="32" y="104" width="236" height="216" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="48" y="132" font-size="18" font-weight="700" fill="#e6edf3">Analytic</text>
<text x="252" y="131" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="end" letter-spacing="1">RUNS</text>
<text x="48" y="154" font-size="13" font-weight="600" fill="#e6edf3">One written detection.</text>
<text x="48" y="176" font-size="12.5" fill="#e6edf3">The sweep runs it every hour.</text>
<text x="48" y="193" font-size="12.5" fill="#e6edf3">live: its hits can form a lead.</text>
<text x="48" y="210" font-size="12.5" fill="#e6edf3">shadow: you read its hits.</text>
<text x="48" y="227" font-size="12.5" fill="#8b949e">draft → shadow → live → retired</text>
<text x="48" y="244" font-size="12.5" fill="#e6edf3">You tune it: approve, reject</text>
<text x="48" y="261" font-size="12.5" fill="#e6edf3">or draft.</text>
<text x="48" y="294" font-size="12.5" fill="#8b949e">Screen: Hunts › Analytics.</text>
<rect x="324" y="104" width="236" height="216" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="340" y="132" font-size="18" font-weight="700" fill="#e6edf3">Hit</text>
<text x="544" y="131" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="end" letter-spacing="1">FOUND</text>
<text x="340" y="154" font-size="13" font-weight="600" fill="#e6edf3">One match of one analytic</text>
<text x="340" y="171" font-size="13" font-weight="600" fill="#e6edf3">on one entity.</text>
<text x="340" y="193" font-size="12.5" fill="#8b949e">An observation with documents</text>
<text x="340" y="210" font-size="12.5" fill="#8b949e">behind it.</text>
<text x="340" y="227" font-size="12.5" fill="#e6edf3">A live hit adds weight to a</text>
<text x="340" y="244" font-size="12.5" fill="#e6edf3">lead. A shadow hit waits for</text>
<text x="340" y="261" font-size="12.5" fill="#e6edf3">you to read it.</text>
<text x="340" y="294" font-size="12.5" fill="#8b949e">Screen: Hunts › Analytic hits.</text>
<rect x="616" y="104" width="236" height="216" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="632" y="132" font-size="18" font-weight="700" fill="#e6edf3">Lead</text>
<text x="836" y="131" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="end" letter-spacing="1">HUNT IT</text>
<text x="632" y="154" font-size="13" font-weight="600" fill="#e6edf3">Observations on one entity</text>
<text x="632" y="171" font-size="13" font-weight="600" fill="#e6edf3">that are worth one decision.</text>
<text x="632" y="193" font-size="12.5" fill="#e6edf3">A new lead starts its own hunt.</text>
<text x="632" y="210" font-size="12.5" fill="#e6edf3">Or press Hunt this lead.</text>
<text x="632" y="227" font-size="12.5" fill="#e6edf3">Dismiss a lead that is noise.</text>
<text x="632" y="244" font-size="12.5" fill="#8b949e">Related leads share an analytic,</text>
<text x="632" y="261" font-size="12.5" fill="#8b949e">an address or a technique.</text>
<text x="632" y="294" font-size="12.5" fill="#8b949e">Screen: Hunts › Leads.</text>
<rect x="956" y="104" width="236" height="216" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="972" y="132" font-size="18" font-weight="700" fill="#e6edf3">Hunt</text>
<text x="1176" y="131" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="end" letter-spacing="1">LEARN</text>
<text x="972" y="154" font-size="13" font-weight="600" fill="#e6edf3">One run against</text>
<text x="972" y="171" font-size="13" font-weight="600" fill="#e6edf3">one objective.</text>
<text x="972" y="193" font-size="12.5" fill="#e6edf3">The model or a catalog query</text>
<text x="972" y="210" font-size="12.5" fill="#e6edf3">runs it. It returns findings.</text>
<text x="972" y="227" font-size="12.5" fill="#e6edf3">soc-ai investigates each</text>
<text x="972" y="244" font-size="12.5" fill="#e6edf3">threat finding at the end.</text>
<text x="972" y="261" font-size="12.5" fill="#e6edf3">It takes no action itself.</text>
<text x="972" y="278" font-size="12.5" fill="#8b949e">A threat finding with none</text>
<text x="972" y="295" font-size="12.5" fill="#8b949e">offers Open an investigation.</text>
<rect x="1332" y="104" width="236" height="432" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
<text x="1348" y="132" font-size="18" font-weight="700" fill="#e6edf3">Investigation</text>
<text x="1552" y="131" font-size="11" font-weight="700" fill="#a371f7" text-anchor="end" letter-spacing="1">DECIDE</text>
<text x="1348" y="154" font-size="13" font-weight="600" fill="#e6edf3">One agent run that ends</text>
<text x="1348" y="171" font-size="13" font-weight="600" fill="#e6edf3">in a verdict.</text>
<text x="1348" y="193" font-size="12.5" fill="#e6edf3">Its subject is one alert, or</text>
<text x="1348" y="210" font-size="12.5" fill="#e6edf3">a hunt and its findings.</text>
<text x="1348" y="227" font-size="12.5" fill="#e6edf3">It recommends actions and</text>
<text x="1348" y="244" font-size="12.5" fill="#e6edf3">writes an audit record.</text>
<text x="1348" y="266" font-size="12.5" fill="#8b949e">true positive, false positive</text>
<text x="1348" y="283" font-size="12.5" fill="#8b949e">or needs more info, with a</text>
<text x="1348" y="300" font-size="12.5" fill="#8b949e">confidence.</text>
<text x="1348" y="322" font-size="12.5" fill="#8b949e">Triage is the run. The</text>
<text x="1348" y="339" font-size="12.5" fill="#8b949e">investigation is its record.</text>
<text x="1348" y="400" font-size="12.5" fill="#e6edf3">Each threat finding of a hunt</text>
<text x="1348" y="417" font-size="12.5" fill="#e6edf3">gets an investigation. Two</text>
<text x="1348" y="434" font-size="12.5" fill="#e6edf3">findings can share one.</text>
<text x="1348" y="451" font-size="12.5" fill="#e6edf3">An alert gets one when</text>
<text x="1348" y="468" font-size="12.5" fill="#e6edf3">soc-ai triages it.</text>
<text x="1348" y="510" font-size="12.5" fill="#8b949e">Screen: Investigations.</text>
<path d="M 268,204 L 324,204" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="296" y="196" font-size="12" fill="#58a6ff" text-anchor="middle">finds</text>
<path d="M 560,204 L 616,204" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="588" y="196" font-size="12" fill="#58a6ff" text-anchor="middle">forms</text>
<path d="M 852,204 L 956,204" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="904" y="196" font-size="12" fill="#58a6ff" text-anchor="middle">Hunt this lead</text>
<text x="904" y="222" font-size="11" fill="#58a6ff" text-anchor="middle">or auto-hunt</text>
<path d="M 1192,204 L 1332,204" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="1262" y="196" font-size="12" fill="#58a6ff" text-anchor="middle">investigates</text>
<text x="1262" y="222" font-size="12" fill="#58a6ff" text-anchor="middle">each threat finding</text>
<path d="M 1074,320 L 1074,336 L 442,336 L 442,320" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="758" y="350" font-size="12" fill="#3fb950" text-anchor="middle">a threat finding writes an observation</text>
<path d="M 1332,364 L 400,364 L 400,320" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="1060" y="378" font-size="12" fill="#3fb950" text-anchor="middle">a verdict writes an observation</text>
<text x="32" y="388" font-size="11" font-weight="700" fill="#a371f7" letter-spacing="1">THE ALERT PATH · EVERY ALERT</text>
<rect x="32" y="396" width="236" height="140" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
<text x="48" y="424" font-size="18" font-weight="700" fill="#e6edf3">Alert</text>
<text x="252" y="423" font-size="11" font-weight="700" fill="#a371f7" text-anchor="end" letter-spacing="1">INPUT</text>
<text x="48" y="446" font-size="13" font-weight="600" fill="#e6edf3">A detection the grid raised.</text>
<text x="48" y="463" font-size="12.5" fill="#8b949e">Suricata · Sigma · notice.</text>
<text x="48" y="480" font-size="12.5" fill="#e6edf3">Auto-Investigate triages it,</text>
<text x="48" y="497" font-size="12.5" fill="#e6edf3">or you press Investigate.</text>
<text x="48" y="520" font-size="12.5" fill="#8b949e">Screen: Alerts.</text>
<path d="M 268,466 L 1332,466" fill="none" stroke="#a371f7" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="800" y="456" font-size="12" fill="#a371f7" text-anchor="middle">soc-ai triages the alert</text>
<path d="M 1450,536 L 1450,576" fill="none" stroke="#a371f7" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="1462" y="561" font-size="12" fill="#a371f7">ends in</text>
<rect x="1332" y="576" width="236" height="100" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
<text x="1348" y="604" font-size="18" font-weight="700" fill="#e6edf3">Verdict</text>
<text x="1348" y="626" font-size="12.5" fill="#e6edf3">The answer of an investigation.</text>
<text x="1348" y="643" font-size="12.5" fill="#e6edf3">Agree, or override it.</text>
<text x="1348" y="660" font-size="12.5" fill="#8b949e">Request more info on a gap.</text>
<path d="M 1450,676 L 1450,716" fill="none" stroke="#a371f7" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="1462" y="701" font-size="12" fill="#a371f7">you act</text>
<rect x="1332" y="716" width="236" height="130" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
<text x="1348" y="743" font-size="15" font-weight="700" fill="#e6edf3">Action in Security Onion</text>
<text x="1348" y="765" font-size="12.5" fill="#e6edf3">Acknowledge, escalate to a</text>
<text x="1348" y="782" font-size="12.5" fill="#e6edf3">case, or add a comment.</text>
<text x="1348" y="804" font-size="12.5" fill="#8b949e">soc-ai writes it to Security</text>
<text x="1348" y="821" font-size="12.5" fill="#8b949e">Onion and keeps a receipt.</text>
<rect x="32" y="576" width="868" height="140" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="48" y="604" font-size="15" font-weight="700" fill="#d29922">Needs you: the one queue</text>
<text x="48" y="628" font-size="12.5" fill="#e6edf3">Leads that wait on a decision, unread shadow hits, alert groups with no verdict,</text>
<text x="48" y="646" font-size="12.5" fill="#e6edf3">verdicts that need more info, and recommended actions that wait for you.</text>
<text x="48" y="664" font-size="12.5" fill="#e6edf3">You decide on one object: agree, override, acknowledge, escalate, dismiss, or open an investigation.</text>
<text x="48" y="688" font-size="12.5" fill="#8b949e">The sidebar badge, the bell and the Dashboard tile show the same count.</text>
<path d="M 900,612 L 1332,612" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="1116" y="604" font-size="12" fill="#d29922" text-anchor="middle">agree or override the verdict</text>
<path d="M 900,662 L 1300,662 L 1300,781 L 1332,781" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="1100" y="654" font-size="12" fill="#d29922" text-anchor="middle">acknowledge or escalate</text>
<rect x="32" y="732" width="868" height="114" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="48" y="760" font-size="15" font-weight="700" fill="#e6edf3">Two verbs</text>
<text x="48" y="784" font-size="12.5" fill="#e6edf3">Hunt this lead: learn what is here. The hunt returns findings. soc-ai investigates each threat finding.</text>
<text x="48" y="802" font-size="12.5" fill="#e6edf3">Open an investigation: decide and act. It is the manual control on a finding with no investigation.</text>
<text x="48" y="820" font-size="12.5" fill="#8b949e">An investigation ends in a verdict, recommended actions and an audit record.</text>
<text x="48" y="838" font-size="12.5" fill="#8b949e">soc-ai investigates each threat finding when the hunt ends.</text>
</svg>
