rubric_notes: |
  Medium TP. Suricata fires only an ET HUNTING (Minor severity) rule — no
  blocklist match, no commodity TROJAN signature. The verdict requires
  correlating: (1) the JA3/JA3S fingerprint pair against known Cobalt Strike
  defaults (in this scenario, the loader is expected to wire the published
  CS defaults — see Salesforce JA3 origin post), and (2) the conn-log beacon
  profile (95% interval similarity, near-constant byte counts). System that
  takes only the alert at face value and emits FP because severity=Minor =
  failure. System that ignores Zeek correlation = failure.

  Fidelity note (2026-08-26): the beacon cadence is planted as 31 RAW
  zeek.conn check-ins (~60s mean, 5.6s stdev, cv 0.093 over ~30 minutes),
  not just the pre-aggregated conn_summary doc. This is scenario fidelity,
  not tuning-to-pass: t_beacon_profile computes cadence from raw rows
  (min_events=8, cv <= 0.15 for "periodic"), and a real Cobalt Strike beacon
  over that window produces exactly this many connections — the earlier
  single-row encoding under-specified the attack and made the flagship hunt
  journey unwinnable by construction. The summary doc is kept for the triage
  path. b1 (the benign twin) deliberately keeps its single raw conn row, so
  the cadence sweep surfaces only m1 and the verdict still turns on the
  TLS/JA3 evidence, not on the sweep having flagged.
