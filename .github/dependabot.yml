# Weekly bump PRs for every surface this repo pins, so a lockfile carrying a
# known advisory, or a SHA-pinned action / digest-pinned base image that fell
# behind its release, arrives as a diff to review instead of aging silently.
# The CI `dependency audit` job then proves the refreshed lock is clean.
#
# Minor and patch bumps come grouped as one PR per ecosystem; majors stay
# separate because they carry API changes that need their own read (mcp and
# fastmcp on the Python side, vite/vitest/react-router on the SPA).
version: 2
updates:
  # uv.lock: runtime + dev groups (the `pip` ecosystem does not read uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      include: "scope"

  # frontend/package-lock.json.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      include: "scope"

  # The SHA-pinned `uses:` lines in .github/workflows (release.yml explains
  # why they are SHAs); Dependabot moves the SHA and the version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"

  # The digest-pinned FROM lines in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
