id: b4-av-dns-reputation
name: "AV cloud file-reputation DNS lookups mistaken for DNS tunneling"
version: 1
tier: medium
story: |
  Workstation 10.0.0.57 runs the org-standard AVShield endpoint-protection
  agent. On every new-file scan the agent looks up the file's hash against the
  vendor's DNS-based reputation cloud: an A query for
  <32-hex-char-hash>.filerep.avshield.example against the corporate resolver
  (10.0.0.1). A software rollout this morning makes the host scan thousands of
  new files, so the sensor sees ~2,900 machine-generated, high-entropy,
  never-repeating subdomains in 30 minutes — the exact volume + entropy shape
  a DNS-tunnel heuristic hunts for, and the analytic fires. The raw zeek.dns
  rows below carry the trailing ~35 seconds of that burst (56 queries at
  ~1.6 queries/sec); the zeek.dns_summary doc is the 30-minute aggregate. But the
  corroborating evidence disposes it as benign: every query is qtype A (zero
  TXT/NULL — no downstream data channel), every qname is a fixed-length
  hex-only label (a hash, not variable-length encoded payload), the answers
  collapse to a 3-value reputation-code set in 127.0.0.0/8 (~1.5 bits per
  response — nothing can be tunneled back through that), 143 other internal
  hosts query the same parent domain (an org-wide agent, not a single
  compromised host), the domain has been seen by the org for over a year, and
  the host's egress is otherwise normal — including periodic HTTPS from the
  same agent to the vendor's telemetry endpoint with a stock WinHTTP JA3.
  A good analyst recognizes DNS-based reputation lookups — a notorious
  tunnel-heuristic false-positive class — and dispositions it benign.
attack: []
sigma_refs: []

ground_truth:
  verdict: false_positive
  confidence_min: 0.65
  required_citation_kinds:
    - prefetch_pivot         # dns_summary: qtype 100% A + fixed-length hex + tiny answer space
    - prefetch_pivot         # conn/ssl: normal mixed egress incl. vendor telemetry HTTPS
  expected_actions:
    - kind: close_benign
  expected_field_reconciliation: false

events:
  - index: logs-synth-suricata-alert
    time_offset_seconds: 0
    is_triage_target: true
    fields:
      "@timestamp": "{{ run_time }}"
      event.dataset: suricata.alert
      event.module: suricata
      event.kind: alert
      event.category: [network, intrusion_detection]
      event.action: allowed
      event.severity: 3
      source.ip: "10.0.0.57"
      source.port: 58917
      destination.ip: "10.0.0.1"
      destination.port: 53
      network.transport: udp
      network.protocol: dns
      network.community_id: "{{ community_id(source.ip, source.port, destination.ip, destination.port, 'udp') }}"
      rule.name: "SOC-AI ANALYTIC High-Volume Machine-Generated DNS Subdomains"
      rule.category: "Anomalous Traffic"
      rule.signature: "9700004"  # synthetic SID — analytic-as-alert
      # Real Security Onion shape: Suricata rule metadata rides rule.metadata
      # (single-element-list values) and the classtype rides the EVE message
      # JSON as alert.category — SoAlert reads both from there, and a flat
      # top-level copy is invisible to the typed parse.
      rule.metadata:
        signature_severity: ["Informational"]
      message: '{"alert": {"category": "bad-unknown"}}'
      observer.name: "so-sensor-1"
      synth.scenario_id: b4-av-dns-reputation
      synth.scenario_version: 1

  - index: logs-synth-zeek-dns
    time_offset_seconds: 0
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time }}"
      event.dataset: zeek.dns
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.57"
      source.port: 58917
      destination.ip: "10.0.0.1"
      destination.port: 53
      network.community_id: "{{ same_as_triage }}"
      zeek.dns.query: "3f8a9c0d1e2b4a5c6d7e8f9012a3b4c5.filerep.avshield.example"
      zeek.dns.qtype_name: "A"
      zeek.dns.rcode_name: "NOERROR"
      zeek.dns.answers: ["127.0.0.2"]   # reputation code (clean), not routable data
      zeek.dns.TTLs: [300]
      synth.scenario_id: b4-av-dns-reputation

  # The raw reputation lookups — the benign twin must be MEASURABLE by the
  # same sweep that flags m2, or it is a negative control the instrument
  # skips (which proves nothing). These 55 rows + the t=0 row above are the
  # trailing ~35 seconds of the rollout scan burst at the story's ~1.6
  # queries/sec: 56 unique fixed-length 32-hex-char hash subdomains, all
  # qtype A, answers collapsing to the 3-value reputation-code set. Under
  # t_dns_entropy_scan's naive last-two-labels split the parent is
  # avshield.example and "filerep" folds into the measured subdomain, so the
  # sweep's per-sub entropy is ~4.02 (bare hash labels: ~3.63) — above the
  # 3.5 candidacy bar (entropy alone canNOT clear this twin; hashes ARE
  # high-entropy) but below the 4.2 decisive arm, and the slice volume sits
  # below both tunnel-volume arms, so the parent is scanned and NOT flagged.
  # At the story's full window volume (2,731 unique subdomains >= 200) the
  # sweep WOULD flag it, and the disposition then turns on the channel shape
  # in these rows: all-A qtypes, stddev-0 qname length, ~1.5-bit answers.
