id: b7-browser-doh
name: "Browser DNS-over-HTTPS mistaken for a covert channel"
version: 1
tier: medium
story: |
  Workstation 10.0.0.94 runs Chrome with its default secure-DNS setting, so
  the browser resolves through Cloudflare's public DoH endpoint
  (cloudflare-dns.com) over TLS instead of asking the corporate resolver.
  The same ET POLICY rule that fires on m6-doh-c2-channel fires here. It is
  not a covert channel: the operating system still sends 412 plaintext
  queries to 10.0.0.1 in the same window (a browser's DoH is additive, not a
  replacement), the TLS client fingerprint is Chrome's, the host has 37 other
  browsing destinations open, and the DoH traffic is page-load driven — three
  connections in a burst when a page loads, then four minutes of nothing,
  then another burst. Measured over the window: 12 connections, mean gap
  244s, standard deviation 461s.
attack: []
sigma_refs: []

ground_truth:
  verdict: false_positive
  confidence_min: 0.65
  required_citation_kinds:
    - prefetch_pivot         # resolver profile: plaintext DNS to 10.0.0.1 continues
    - prefetch_pivot         # zeek.ssl: Chrome JA3 alongside ordinary browsing
  expected_actions:
    - kind: close_benign
  expected_field_reconciliation: false

events:
  - index: logs-synth-suricata-alert
    time_offset_seconds: 0
    is_triage_target: true
    fields:
      "@timestamp": "{{ run_time }}"
      event.dataset: suricata.alert
      event.module: suricata
      event.kind: alert
      event.category: [network, intrusion_detection]
      event.action: allowed
      event.severity: 3
      source.ip: "10.0.0.94"
      source.port: 52288
      destination.ip: "1.1.1.1"
      destination.port: 443
      network.transport: tcp
      network.protocol: ssl
      network.community_id: "{{ community_id(source.ip, source.port, destination.ip, destination.port, 'tcp') }}"
      rule.name: "ET POLICY DNS over HTTPS Resolver Contacted Outside Approved List"
      rule.category: "Potential Corporate Privacy Violation"
      rule.signature: "2027758"  # same rule as m6 — it cannot tell them apart
      # Real Security Onion shape: Suricata rule metadata rides rule.metadata
      # (single-element-list values) and the classtype rides the EVE message
      # JSON as alert.category — SoAlert reads both from there, and a flat
      # top-level copy is invisible to the typed parse.
      rule.metadata:
        signature_severity: ["Informational"]
      message: '{"alert": {"category": "policy-violation"}}'
      observer.name: "so-sensor-1"
      synth.scenario_id: b7-browser-doh
      synth.scenario_version: 1

  - index: logs-synth-zeek-ssl
    time_offset_seconds: 0
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time }}"
      event.dataset: zeek.ssl
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.94"
      source.port: 52288
      destination.ip: "1.1.1.1"
      destination.port: 443
      network.community_id: "{{ same_as_triage }}"
      zeek.ssl.version: "TLSv13"
      zeek.ssl.ja3: "cd08e31494f9531f560d64c695473da9"   # Chrome on Windows
      zeek.ssl.ja3s: "eb1d94daa7e0344597e756a1fb6e7054"
      zeek.ssl.server_name: "cloudflare-dns.com"
      zeek.ssl.established: true
      synth.scenario_id: b7-browser-doh

  # The decisive negative: name resolution did NOT move. m6's host sent zero
  # plaintext queries in its window against a 1,120/day baseline.
  - index: logs-synth-zeek-dns-summary
    time_offset_seconds: -2720
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time | offset_seconds(-2720) }}"
      event.dataset: zeek.dns_summary
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.94"
      synth.resolver_profile:
        window_seconds: 2720
        plaintext_dns_queries_this_window: 412
        plaintext_dns_queries_prior_daily_mean_14d: 1180
        corporate_resolvers: ["10.0.0.1"]
        doh_endpoint_sni: "cloudflare-dns.com"
        doh_endpoint_on_approved_list: false
        doh_sni_org_first_seen_days_ago: 511
        doh_sni_other_internal_hosts_30d: 214
        browser_tls_sessions_this_window: 194
        distinct_external_destinations_this_window: 38
      synth.scenario_id: b7-browser-doh

  # A sample of the ordinary browsing this host is doing at the same time.
  - index: logs-synth-zeek-ssl
    time_offset_seconds: -1836
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time | offset_seconds(-1836) }}"
      event.dataset: zeek.ssl
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.94"
      source.port: 52190
      destination.ip: "203.0.113.140"
      destination.port: 443
      zeek.ssl.version: "TLSv13"
      zeek.ssl.ja3: "cd08e31494f9531f560d64c695473da9"   # same Chrome fingerprint
      zeek.ssl.ja3s: "eb1d94daa7e0344597e756a1fb6e7054"
      zeek.ssl.server_name: "docs.intranet-portal.example"
      zeek.ssl.established: true
      synth.scenario_id: b7-browser-doh

  # Raw DoH connections. Deliberately BURSTY: three in a few seconds when a
  # page loads, then minutes of nothing. t_beacon_profile measures cv 1.89
  # over these rows, far above its 0.4 candidacy bar (_CV_MAX), so the sweep
  # does NOT flag this pair — while its attack twin m6-doh-c2-channel measures
  # cv 0.030 and IS flagged. The destination is globally routable (1.1.1.1)
  # for exactly that reason: a documentation address would be dropped as
  # non-global and the twin would read as "not flagged" for the wrong reason,
  # making the comparison meaningless.
