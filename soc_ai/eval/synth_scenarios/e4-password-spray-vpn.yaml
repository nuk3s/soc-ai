id: e4-password-spray-vpn
name: "Password spray against the VPN portal followed by one success"
version: 1
tier: easy
story: |
  Over twelve minutes one external address (198.51.100.77) posts 312
  authentication attempts to the SSL-VPN portal 10.0.0.20 covering 104
  distinct usernames — three passwords tried against each account, never more.
  That is a SPRAY, not a brute force: the attacker is walking the account list
  with a small password set to stay under per-account lockout thresholds. 311
  attempts return HTTP 401. Attempt 312 returns 302 to the portal landing page
  for the service account `svc-backup`, and that session then pulls 240 MB out
  of the portal in eleven minutes. The account list is alphabetical
  (aabbott, aacosta, abarnes, ...), which is what a harvested or enumerated
  directory looks like, and every request carries the same non-browser
  user agent.
attack:
  - T1110.003  # Brute Force: Password Spraying
  - T1078      # Valid Accounts
  - T1133      # External Remote Services
sigma_refs: []

ground_truth:
  verdict: true_positive
  confidence_min: 0.75
  required_citation_kinds:
    - prefetch_pivot         # auth summary: 104 usernames / 3 passwords each / 1 success
    - typed_path             # rule.name + the successful 302
  expected_actions:
    - kind: escalate
    - kind: disable_account
      target_field: user.name
    - kind: block_indicator
      target_field: source.ip
  expected_field_reconciliation: false

events:
  - index: logs-synth-suricata-alert
    time_offset_seconds: 0
    is_triage_target: true
    fields:
      "@timestamp": "{{ run_time }}"
      event.dataset: suricata.alert
      event.module: suricata
      event.kind: alert
      event.category: [network, intrusion_detection]
      event.action: allowed
      event.severity: 1
      source.ip: "198.51.100.77"
      source.port: 44118
      destination.ip: "10.0.0.20"
      destination.port: 443
      network.transport: tcp
      network.protocol: http
      network.community_id: "{{ community_id(source.ip, source.port, destination.ip, destination.port, 'tcp') }}"
      rule.name: "SOC-AI ANALYTIC Password Spray Followed by Successful Authentication"
      rule.category: "Attempted Administrator Privilege Gain"
      rule.signature: "9700020"  # illustrative SID — Zeek analytic surfaced as an alert
      # Real Security Onion shape: Suricata rule metadata rides rule.metadata
      # (single-element-list values) and the classtype rides the EVE message
      # JSON as alert.category — SoAlert reads both from there, and a flat
      # top-level copy is invisible to the typed parse.
      rule.metadata:
        signature_severity: ["Major"]
      message: '{"alert": {"category": "attempted-admin"}, "payload_printable": "POST /remote/logincheck HTTP/1.1\r\nHost: vpn.corp.example\r\nUser-Agent: python-requests/2.31.0\r\n\r\nusername=svc-backup&credential=Autumn2026!"}'
      user.name: "svc-backup"
      observer.name: "so-sensor-1"
      synth.scenario_id: e4-password-spray-vpn
      synth.scenario_version: 1

  # The decisive aggregate: the SHAPE of the attempt set. One password per
  # account per round, three rounds, 104 accounts — deliberately under the
  # portal's five-attempt lockout. A single compromised client looping bad
  # credentials would show ONE username, not 104.
  - index: logs-synth-zeek-http-auth-summary
    time_offset_seconds: -720
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time | offset_seconds(-720) }}"
      event.dataset: zeek.http_summary
      event.module: zeek
      event.kind: event
      source.ip: "198.51.100.77"
      destination.ip: "10.0.0.20"
      destination.port: 443
      synth.auth_attempt_profile:
        window_seconds: 720
        uri: "/remote/logincheck"
        attempts_total: 312
        distinct_usernames: 104
        attempts_per_username_max: 3
        attempts_per_username_min: 3
        distinct_passwords: 3
        status_401_count: 311
        status_302_count: 1
        successful_username: "svc-backup"
        username_ordering: "alphabetical"
        distinct_user_agents: 1
        user_agent: "python-requests/2.31.0"
        source_prior_days_seen: 0        # this address has never reached the portal before
      synth.scenario_id: e4-password-spray-vpn

  # Representative raw attempts — three different accounts, same password
  # round, same second-scale spacing, all 401.
  - index: logs-synth-zeek-http
    time_offset_seconds: -716
    is_triage_target: false
    fields: &e4_spray_attempt
      "@timestamp": "{{ run_time | offset_seconds(-716) }}"
      event.dataset: zeek.http
      event.module: zeek
      event.kind: event
      source.ip: "198.51.100.77"
      source.port: 44092
      destination.ip: "10.0.0.20"
      destination.port: 443
      zeek.http.method: "POST"
      zeek.http.host: "vpn.corp.example"
      zeek.http.uri: "/remote/logincheck"
      zeek.http.status_code: 401
      zeek.http.user_agent: "python-requests/2.31.0"
      zeek.http.request_body_len: 48
      zeek.http.response_body_len: 132
      synth.attempt_username: "aabbott"
      synth.scenario_id: e4-password-spray-vpn
  - index: logs-synth-zeek-http
    time_offset_seconds: -714
    is_triage_target: false
    fields:
      <<: *e4_spray_attempt
      "@timestamp": "{{ run_time | offset_seconds(-714) }}"
      source.port: 44094
      synth.attempt_username: "aacosta"
  - index: logs-synth-zeek-http
    time_offset_seconds: -711
    is_triage_target: false
    fields:
      <<: *e4_spray_attempt
      "@timestamp": "{{ run_time | offset_seconds(-711) }}"
      source.port: 44097
      synth.attempt_username: "abarnes"

  # Attempt 312 — the one that lands. Same client, same URI, status 302.
  - index: logs-synth-zeek-http
    time_offset_seconds: 0
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time }}"
      event.dataset: zeek.http
      event.module: zeek
      event.kind: event
      source.ip: "198.51.100.77"
      source.port: 44118
      destination.ip: "10.0.0.20"
      destination.port: 443
      network.community_id: "{{ same_as_triage }}"
      zeek.http.method: "POST"
      zeek.http.host: "vpn.corp.example"
      zeek.http.uri: "/remote/logincheck"
      zeek.http.status_code: 302
      zeek.http.user_agent: "python-requests/2.31.0"
      zeek.http.request_body_len: 51
      zeek.http.response_body_len: 0
      user.name: "svc-backup"
      synth.attempt_username: "svc-backup"
      synth.scenario_id: e4-password-spray-vpn

  # What the authenticated session then did: 240 MB out of the portal. A
  # service account that exists to run nightly jobs has no reason to hold an
  # interactive VPN session, let alone pull a quarter of a gigabyte through it.
  - index: logs-synth-zeek-conn
    time_offset_seconds: 30
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time | offset_seconds(30) }}"
      event.dataset: zeek.conn
      event.module: zeek
      event.kind: event
      source.ip: "198.51.100.77"
      source.port: 44121
      destination.ip: "10.0.0.20"
      destination.port: 443
      network.transport: tcp
      zeek.conn.state: "SF"
      zeek.conn.history: "ShAdfFa"
      zeek.conn.duration: 663.4
      zeek.conn.orig_bytes: 91240
      zeek.conn.resp_bytes: 251658240
      zeek.conn.local_orig: false
      zeek.conn.local_resp: true
      zeek.conn.service: "ssl"
      user.name: "svc-backup"
      synth.scenario_id: e4-password-spray-vpn

rubric_notes: |
  Easy TP. There is no blocklist entry and no commodity signature here — the
  tier is easy because three independent signals corroborate inside the
  telemetry itself, not because an oracle answered the question:

  (1) The attempt SHAPE is a spray, and the shape is measured, not asserted:
      104 distinct usernames, exactly three attempts each, three distinct
      passwords, walked in alphabetical order. Credential-stuffing tooling
      produces this; a misconfigured client with a stale password produces one
      username repeated, and a classic brute force produces one username with
      hundreds of passwords. The 104:3 ratio is the discriminator.
  (2) The spray SUCCEEDED — 311 x 401 then a single 302 for `svc-backup`.
      A spray with no success is an exposure finding; a spray with a success
      is an intrusion. The verdict turns on that one status code.
  (3) The authenticated session pulled 240 MB back through the portal in
      eleven minutes on a service account, from an address that had never
      reached the portal in the preceding baseline.

  A system that reports "authentication failures observed" and closes on the
  failures alone has missed the compromise: the interesting record is the one
  request that did NOT fail. Required actions include disabling the sprayed
  account — the credential is known-bad the moment the 302 lands, and it is
  the only action that stops re-entry from a different source address.

  Deliberately NOT required: a `blocklist_hit` citation. The source is an
  RFC 5737 documentation address, which the enrichment path treats as
  non-routable and never submits to a third party, so a blocklist requirement
  here would be an unreachable floor — a permanent, manufactured miss.
