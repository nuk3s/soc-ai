---
# Run with `uv run pre-commit install` after cloning to activate the hooks.
# To run manually against everything: `uv run pre-commit run --all-files`.
#
# Hooks are intentionally fast — under 5s on a typical change — so they
# don't slow `git commit`. The full pytest suite is NOT part of pre-commit
# (it's run in CI); only the formatters + linter that catch the ~80% of
# regressions immediately surfaceable from a diff.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml needs `!!python/name:` tags (superfences, the Material
        # emoji index) that this hook's safe load rejects; mkdocs validates
        # that file itself through `mkdocs build --strict` in CI.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff version in uv.lock (tests/test_supply_chain_pins.py
    # holds them together). An older hook does not know the newer rules, so
    # its --fix strips the `# noqa` comments CI's ruff still needs.
    rev: v0.15.12
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: ["--fix"]

# Note: mypy is intentionally NOT in pre-commit. It needs the full
# project venv to resolve dependencies (pydantic-ai's profiles, lark
# without stubs, etc.) and runs slow enough to feel intrusive on every
# commit. Run it manually before pushing:
#
#     uv run mypy soc_ai
#
# CI runs the same check on PRs.
