rubric_notes: |
  Hard TP. Informational alert, both hosts internal, no IOC, no signature,
  and every individual operation is one a finance user is allowed to perform.
  The verdict lives in the aggregate shape, and each part of it is a measured
  value in the events:

  (1) BREADTH — six shares, five of which are outside the user's 90-day
      baseline of one. Access rights and access habits are different things,
      and the gap between them is the anomaly.
  (2) RATE — 1,843 distinct files at 204.8 per minute for nine minutes,
      against a user baseline of 37 files per DAY. This is a program walking
      a directory tree, not a person working.
  (3) THE WRITE — one 3.2 GB .7z placed back on a share, immediately after
      12.9 GB was read. Collection, compression, staging. The archive is the
      whole point: reads alone could be an over-eager search indexer; reads
      followed by a single large archive is data being prepared to leave or
      to be held hostage.

  Nothing is encrypted and nothing has left the network yet, so the window to
  act is open — which is why this is scored true_positive on staging alone
  rather than waiting for impact. Disabling the account matters as much as
  isolating the host: the credential is what carries the access.

  Discrimination against the benign backup shape (see b6-backup-scheduled-
  transfer): a backup product reads from a DESIGNATED host on a schedule and
  writes to backup storage, not from a user workstation into a user share
  under a finance user's account, and it does not have a 90-day baseline of
  37 files a day. A system that escalates on "large SMB transfer" alone will
  also escalate on every backup window in the estate.
