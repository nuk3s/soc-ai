id: h5-ransomware-staging
name: "Mass share reads then archive creation — ransomware/exfil staging"
version: 1
tier: hard
story: |
  Finance workstation 10.0.0.101 mounts six file-server shares in ninety
  seconds — Finance, HR, Legal, Engineering, Contracts, Payroll — five of
  which its user has never touched. Over the next nine minutes it opens and
  reads 1,843 distinct documents across all six, at a sustained 204 files a
  minute, pulling 12.9 GB down the session. Then it writes one file back:
  backup_2026.7z, 3.2 GB, into \\10.0.0.150\Finance\Temp. Read everything,
  compress it into one object, put the object somewhere it can be collected
  from. No signature fires; a Zeek analytic raises an Informational notice on
  the file-access rate. Nothing has been encrypted yet, which is the only
  reason this is still worth catching.
attack:
  - T1083      # File and Directory Discovery
  - T1074.002  # Data Staged: Remote Data Staging
  - T1560.001  # Archive Collected Data: Archive via Utility
  - T1486      # Data Encrypted for Impact (the staged intent)
sigma_refs: []

ground_truth:
  verdict: true_positive
  confidence_min: 0.70
  required_citation_kinds:
    - prefetch_pivot         # smb access profile: 1843 files / 6 shares / 9 minutes
    - prefetch_pivot         # smb_files: the 3.2 GB archive written back
    - typed_path             # rule.name / the archive filename
  expected_actions:
    - kind: escalate
    - kind: isolate
      target_field: source.ip
    - kind: disable_account
      target_field: user.name
  expected_field_reconciliation: false

events:
  - index: logs-synth-suricata-alert
    time_offset_seconds: 0
    is_triage_target: true
    fields:
      "@timestamp": "{{ run_time }}"
      event.dataset: suricata.alert
      event.module: suricata
      event.kind: alert
      event.category: [network, intrusion_detection]
      event.action: allowed
      event.severity: 3
      source.ip: "10.0.0.101"
      source.port: 51204
      destination.ip: "10.0.0.150"
      destination.port: 445
      network.transport: tcp
      network.protocol: smb
      network.community_id: "{{ community_id(source.ip, source.port, destination.ip, destination.port, 'tcp') }}"
      rule.name: "SOC-AI ANALYTIC Anomalous SMB File Access Rate From Single Host"
      rule.category: "Misc activity"
      rule.signature: "9800011"  # illustrative SID — Zeek analytic surfaced as an alert
      # Real Security Onion shape: Suricata rule metadata rides rule.metadata
      # (single-element-list values) and the classtype rides the EVE message
      # JSON as alert.category — SoAlert reads both from there, and a flat
      # top-level copy is invisible to the typed parse.
      rule.metadata:
        signature_severity: ["Informational"]
      message: '{"alert": {"category": "misc-activity"}}'
      user.name: "kdelacruz"
      observer.name: "so-sensor-1"
      synth.scenario_id: h5-ransomware-staging
      synth.scenario_version: 1

  # Breadth: six shares in ninety seconds. Three shown; the summary carries
  # the full count.
  - index: logs-synth-zeek-smb-mapping
    time_offset_seconds: -630
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time | offset_seconds(-630) }}"
      event.dataset: zeek.smb_mapping
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.101"
      destination.ip: "10.0.0.150"
      destination.port: 445
      network.community_id: "{{ same_as_triage }}"
      zeek.smb_mapping.path: "\\\\10.0.0.150\\Finance"
      zeek.smb_mapping.service: "Finance"
      zeek.smb_mapping.share_type: "DISK"
      synth.scenario_id: h5-ransomware-staging

  - index: logs-synth-zeek-smb-mapping
