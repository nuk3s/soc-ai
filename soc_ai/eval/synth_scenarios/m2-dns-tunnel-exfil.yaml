id: m2-dns-tunnel-exfil
name: "DNS tunnel exfil (dnscat2-style)"
version: 1
tier: medium
story: |
  Workstation 10.0.0.88 issues thousands of long TXT queries under
  *.update-cdn.click over 30 minutes (~6000 queries, mean qname length 78
  chars, Shannon entropy on subdomain labels >4.0, predominantly TXT/NULL
  records). Suricata fires ET POLICY DNS Query for .click TLD (Informational
  severity) — alone, pure noise. The host has zero non-DNS egress in the
  window. The real signal is in Zeek dns.log aggregations: volume + entropy
  + qtype distribution + absence of corroborating egress. The raw zeek.dns
  rows below carry the trailing ~20 seconds of that burst (65 queries at the
  story's ~3.3 queries/sec); the zeek.dns_summary doc is the 30-minute
  aggregate.
attack:
  - T1048.003  # Exfiltration Over Alternative Protocol: Unencrypted/Obfuscated Non-C2 Protocol
  - T1071.004  # Application Layer Protocol: DNS
sigma_refs: []

ground_truth:
  verdict: true_positive
  confidence_min: 0.70
  required_citation_kinds:
    - prefetch_pivot         # DNS volume / entropy
    - typed_path
    - prefetch_pivot         # conn.log absence of non-DNS egress
  expected_actions:
    - kind: escalate
    - kind: block_indicator
      target_field: zeek.dns.query
    - kind: isolate
      target_field: source.ip
  expected_field_reconciliation: false

events:
  - index: logs-synth-suricata-alert
    time_offset_seconds: 0
    is_triage_target: true
    fields:
      "@timestamp": "{{ run_time }}"
      event.dataset: suricata.alert
      event.module: suricata
      event.kind: alert
      event.category: [network, intrusion_detection]
      event.action: allowed
      event.severity: 3
      source.ip: "10.0.0.88"
      source.port: 56234
      destination.ip: "10.0.0.1"
      destination.port: 53
      network.transport: udp
      network.protocol: dns
      network.community_id: "{{ community_id(source.ip, source.port, destination.ip, destination.port, 'udp') }}"
      rule.name: "ET POLICY DNS Query for .click TLD"
      rule.category: "Potential Corporate Privacy Violation"
      rule.signature: "2027866"
      # Real Security Onion shape: Suricata rule metadata rides rule.metadata
      # (single-element-list values) and the classtype rides the EVE message
      # JSON as alert.category — SoAlert reads both from there, and a flat
      # top-level copy is invisible to the typed parse.
      rule.metadata:
        signature_severity: ["Informational"]
      message: '{"alert": {"category": "policy-violation"}}'
      observer.name: "so-sensor-1"
      synth.scenario_id: m2-dns-tunnel-exfil
      synth.scenario_version: 1

  - index: logs-synth-zeek-dns-summary
    time_offset_seconds: -1800
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time | offset_seconds(-1800) }}"
      event.dataset: zeek.dns_summary
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.88"
      synth.dns_profile:
        parent_domain: "update-cdn.click"
        query_count: 6018
        window_seconds: 1800
        unique_subdomains: 5912
        qname_length_mean: 78.4
        qname_length_p95: 132
        # Matches the measured mean over the planted raw slice (base32-encoded
        # payload labels) — a summary that contradicts its own raw rows would
        # hand the analyst a manufactured inconsistency.
        qname_label_entropy_mean: 4.56
        qtype_distribution:
          TXT: 4892
          NULL: 1014
          A: 112
        rcode_distribution:
          NOERROR: 6010
          NXDOMAIN: 8
      synth.scenario_id: m2-dns-tunnel-exfil

  # The raw tunnel queries — FIDELITY, not tuning (the m1 lesson, second
  # application). The original scenario encoded its volume as the dns_summary
  # doc above plus ONE raw zeek.dns row, while t_dns_entropy_scan
  # (soc_ai/tools/analytics.py) measures RAW event.dataset:zeek.dns rows: a
  # parent domain below the min_queries floor (default 50 total queries)
  # doesn't even count as scanned, so the sweep returned parents_scanned == 0
  # and the flagship DNS scenario was invisible to the DNS analytic. These 64
  # rows + the t=0 row below are the trailing ~20 seconds of the tunnel burst
  # at the story's ~3.3 queries/sec: 65 unique base32-encoded payload
  # subdomains (variable length 46-112 chars, mean label entropy ~4.56 —
  # clearing the tool's decisive entropy_mean >= 4.2 arm with margin, the one
  # candidacy arm a slice-sized volume can honestly satisfy), TXT/NULL-mixed
  # qtypes, unique base64 TXT answers. Each query is its own UDP transaction
  # (own ephemeral port + community_id).
  - index: logs-synth-zeek-dns
    time_offset_seconds: -20
    fields: &m2_tunnel_dns
      "@timestamp": "{{ run_time | offset_seconds(-20) }}"
      event.dataset: zeek.dns
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.88"
      source.port: 40011
      destination.ip: "10.0.0.1"
      destination.port: 53
      network.transport: udp
      network.community_id: "{{ community_id(source.ip, source.port, destination.ip, destination.port, 'udp') }}"
      zeek.dns.query: "wzfceqfxrc4wh5wznzsdyyedwlunxrqiip7ssfrmmhvxva.update-cdn.click"
      zeek.dns.qtype_name: "TXT"
      zeek.dns.rcode_name: "NOERROR"
      zeek.dns.answers: ["LGt1LUdbRaEu6YjZ"]
      synth.scenario_id: m2-dns-tunnel-exfil
