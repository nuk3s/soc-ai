rubric_notes: |
  Benign FP that LOOKS like DNS tunneling — the counterweight to
  m2-dns-tunnel-exfil: same alarm shape (thousands of high-entropy,
  never-repeating machine-generated subdomains under one parent domain in a
  short window), opposite verdict. DNS-based file/URL-reputation lookups by
  endpoint-protection agents are a notorious real-world FP class for tunnel
  heuristics. The disposing evidence is IN the events, and it is channel
  capacity + identity, not vibes: (1) qtype distribution is 100% A with zero
  TXT/NULL — a tunnel needs a record type that can carry payload downstream,
  and m2's profile was TXT/NULL-dominated for exactly that reason; (2) every
  qname is a fixed-length (stddev 0.0) hex-only label — a hash, where m2's
  qnames were variable-length (p95 132 vs mean 78) encoded payload; (3) the
  entire answer space is 3 reputation-code values in 127.0.0.0/8 — ~1.5 bits
  per response, so no C2/exfil return channel exists; (4) 143 distinct
  internal hosts query the same parent domain, which the org has resolved for
  391 days — an org-wide agent against an established vendor zone, not a
  single host against a first-seen domain; (5) the host's egress profile is
  a normal mix (SSL/HTTP present, corporate resolver only), where m2's damning
  signal was DNS as the host's ONLY egress; and the same host holds a stock
  WinHTTP-JA3 HTTPS session to the vendor's telemetry endpoint. A system that
  escalates on subdomain volume + entropy alone reproduces the classic
  "security product flagged as malware" page-out. Correct disposition:
  false_positive, close as benign. Emitting true_positive here is scored as
  an escalation FP and drops precision. Note the entropy figure (3.63,
  measured over the planted hash labels) is deliberately real — hashes are
  high-entropy — so the disposition MUST turn on qtype/answer-space/fleet
  evidence, not on arguing the entropy away.

  Fidelity note (2026-08-26): the lookup burst is planted as 56 RAW zeek.dns
  rows, not just the pre-aggregated dns_summary doc — the m2/b4 pair repeated
  the m1 beacon defect (one raw row each, so t_dns_entropy_scan scanned zero
  parents for both and the negative control was one the instrument skipped).
  The sweep now measures this parent (its naive two-label split reads it as
  avshield.example, folding "filerep" into the subdomain: per-sub entropy
  ~4.02) and does NOT flag it at slice volume — above the 3.5 candidacy
  entropy bar but below the 4.2 decisive arm, and below both tunnel-volume
  arms. At the full window volume the summary describes (2,731 unique
  subdomains) the sweep WOULD flag it, which is the story: the disposing
  evidence is channel shape in the raw rows, never entropy.
