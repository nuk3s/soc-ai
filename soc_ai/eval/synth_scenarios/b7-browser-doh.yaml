rubric_notes: |
  Benign FP that fires the identical rule as its attack twin. m6-doh-c2-
  channel and this scenario both show an internal host holding TLS to an
  unapproved DoH resolver, both Informational, both classed policy-violation.
  Contacting a public DoH endpoint is, on its own, a browser default setting
  in a large fraction of the world's estates.

  The disposing evidence is that resolution was SUPPLEMENTED, not REPLACED,
  and it is measured in the events:
  (1) 412 plaintext DNS queries still went to 10.0.0.1 during the window,
      against a 14-day mean of 1,180 a day — the OS resolver is alive and
      working. m6's host sent zero against a mean of 1,120.
  (2) The TLS client fingerprint is Chrome's, and the SAME fingerprint
      appears on 194 other TLS sessions to 37 other destinations in the
      window. m6's fingerprint is a Go HTTP library on a host with no
      browser session at all.
  (3) The endpoint is 511 days old for the org and used by 214 other internal
      hosts. m6's was first seen today, on one host.
  (4) CADENCE, measured rather than asserted: bursts of three connections a
      few seconds apart when a page loads, separated by minutes of silence —
      cv 1.89. m6's is machine-timed at 302s with cv 0.030.

  Point (4) is the one worth insisting on, because it is the one a tool can
  settle. Both scenarios plant raw zeek.conn rows against a globally routable
  destination, so t_beacon_profile evaluates both and separates them on the
  statistic it actually computes. A benign twin that the sweep skips for an
  addressing reason would prove nothing about the sweep.

  Escalating this is scored as an escalation false positive and drops
  precision. A system that treats "DoH observed" as compromise will page on
  every Chrome install in the estate.
