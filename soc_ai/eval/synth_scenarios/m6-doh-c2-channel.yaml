rubric_notes: |
  Medium TP. The alert is Informational and classed policy-violation — DoH to
  an unapproved resolver is, on its own, a policy matter and a very common
  benign finding (see b7-browser-doh, which fires the same rule). What makes
  this an intrusion is the REPLACEMENT, and it is measurable:

  (1) Plaintext DNS from this host to 10.0.0.1 is zero in the window against
      a 14-day mean of 1,120 queries a day. The host still needs to resolve
      names; that traffic has moved inside the TLS channel. b7's host, by
      contrast, keeps sending hundreds of plaintext queries — a browser's DoH
      is additive, malware's is a replacement.
  (2) The TLS client fingerprint is a Go HTTP library and the host opened no
      browser sessions at all in the window. b7's fingerprint is Chrome's and
      sits alongside 37 other browsing destinations.
  (3) The endpoint is first-seen for the org and used by no other host.
  (4) The cadence is machine-timed — 11 connections, mean 302s, cv 0.030 —
      with near-constant sizes in both directions. b7's DoH is page-load
      driven and bursty (measured cv 1.89).

  Reading (4) alone reproduces b1's failure mode; reading (1) alone would also
  fire on a laptop that simply went idle. The pair (resolution moved) +
  (non-browser client on a first-seen endpoint) is the finding.

  Fidelity note: the destination is globally routable rather than an RFC 5737
  documentation address, because t_beacon_profile drops non-globally-routable
  destinations (server-side by CIDR, then client-side via `is_internal_ip`,
  which treats TEST-NET ranges as internal). A documentation address here
  would render cleanly and be invisible to the sweep the journey depends on —
  the m1 failure mode exactly.
