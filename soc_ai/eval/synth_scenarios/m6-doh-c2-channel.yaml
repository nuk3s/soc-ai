      zeek.conn.duration: 0.43
      zeek.conn.orig_bytes: 1479
      zeek.conn.resp_bytes: 2237
      zeek.conn.local_orig: true
      zeek.conn.local_resp: false
      zeek.conn.service: "ssl"
      synth.scenario_id: m6-doh-c2-channel
  - index: logs-synth-zeek-conn
