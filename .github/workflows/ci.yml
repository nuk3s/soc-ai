name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets release.yml reuse this whole workflow as its pre-publish gate
  # (a `v*` tag can't ship an image that wouldn't pass a PR).
  workflow_call:

# Least privilege: CI only reads the repo (no packages/deploy). release.yml
# grants the narrower write scopes on the jobs that actually need them.
permissions:
  contents: read

jobs:
  ci:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    # Raised 10 -> 30 (2026-08-16): the backend suite crossed the old cap as it
    # grew past ~4300 tests — the degraded-grid publish was killed at exactly
    # 10m0s with everything passing, the same failure shape the internal CI
    # config has recorded at 10m, 20m and 35m. The pytest step now runs the
    # suite under pytest-xdist (every test already owns its store under
    # tmp_path) and the app-boot fixture copies a migrated template instead
    # of migrating from scratch; measure a few green runs at that shape before
    # bringing this back down.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes no floating v8 major tag (only v3–v7 float); pin the
        # exact latest so the ref resolves. v8.x runs on Node 24.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # scripts/ is in scope too: pyproject.toml carries per-file-ignores for
      # it and the pre-commit hooks format it, so CI must hold the same line.
      - name: ruff check
        run: uv run ruff check soc_ai/ tests/ scripts/

      - name: ruff format check
        run: uv run ruff format --check soc_ai/ tests/ scripts/

      - name: mypy
        run: uv run mypy soc_ai/

      # Every test owns its store (the autouse fixture chdirs into tmp_path and
      # the data dir is relative), so the suite splits across the runner's
      # cores. `--dist loadfile` keeps a module's tests on one worker, which is
      # what its module-scoped fixtures assume. The flags stay out of pyproject
      # addopts so a targeted local run is unchanged. pytest-cov combines the
      # per-worker data before the 80% gate.
      - name: pytest
        run: uv run pytest -n auto --dist loadfile

  # The store on PostgreSQL. The store test modules carry the `postgres` marker
  # (tests/conftest.py). With SOC_AI_TEST_DATABASE_URL set, each marked test
  # gets a fresh database on the service below and runs against it. The `ci`
  # job runs the same modules on SQLite. The image is pinned to a version and a
  # digest, the same rule as docker-compose.yml. The password belongs to a
  # throwaway service that lives for this job only.
  store-postgres:
    name: store tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: soc_ai
          POSTGRES_PASSWORD: soc_ai_ci
          POSTGRES_DB: soc_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soc_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SOC_AI_TEST_DATABASE_URL: postgresql+asyncpg://soc_ai:soc_ai_ci@127.0.0.1:5432/soc_ai

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # --no-cov: the run covers the store only, so the 80% suite gate does
      # not apply.
      - name: pytest -m postgres
        run: uv run pytest -m postgres -n auto --dist loadfile --no-cov

  # The React SPA (frontend/) — typecheck + unit tests (vitest) + production
  # build so a broken UI can't land silently. There is no eslint setup yet
  # (no dependency, no config, no `lint` script); tsc is the only static gate.
  frontend:
    name: frontend typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

  # The scale harness: a synthetic estate of 2,000 hosts through the dossier
  # sweep, the machine clustering, the profile build and the prior sweep. Each
  # stage stays under a budget of wall time, searches and peak memory. The
  # `ci` job's run ignores tests/scale (pyproject addopts), so the harness runs
  # here on its own, with no coverage gate. `-s` prints the stage table.
  scale:
    name: scale harness (2,000 hosts)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: pytest (scale)
        run: uv run pytest --override-ini "addopts=" --no-header -v -s -m scale tests/scale/

  # End-to-end browser smoke: drives the SEEDED DEMO STACK (seed + mock ES/LLM +
  # the real app serving frontend/dist) through login → alerts → investigation
  # permalink → hunt → config, asserting the walkthrough checklist + zero console
  # errors. Excluded from the `ci` job's coverage-gated run (pyproject addopts
  # `--ignore=tests/browser`); runs here in isolation under `-m browser`.
  browser-smoke:
    name: browser smoke (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci, frontend]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The app serves frontend/dist — build the SPA before the smoke drives it.
      - name: build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install chromium (+ system deps)
        run: uv run playwright install --with-deps chromium

      # Override the coverage-gated addopts (which also carries
      # `--ignore=tests/browser`) so this job collects + runs ONLY the browser
      # smoke, with no coverage gate applied.
      - name: pytest (browser smoke)
        run: uv run pytest --override-ini "addopts=" --no-header -v -m browser tests/browser/

  # Strict docs build on every PR, so a page renamed out from under mkdocs.yml's
  # nav or a broken internal link fails here and not in the post-merge Pages
  # deploy (docs.yml), which used to be the first strict run. Only the docs
  # group from uv.lock is installed: the site build needs none of the app.
  # Never add -q: quiet mode exits 0 on a strict abort.
  docs:
    name: docs strict build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the docs group
        run: uv sync --only-group docs --frozen

      - name: mkdocs build (strict)
        run: uv run --no-sync mkdocs build --strict

  # Known-advisory gate on what ships: the locked runtime Python set (uv.lock
  # without the dev group) and the SPA's production npm dependencies. Its own
  # job, so a new advisory shows up as "dependency audit" in the checks rather
  # than as a test failure, and so it runs even when nothing else moved. An
  # advisory with no released fix is not actionable here: allowlist it with
  # `--ignore-vuln <ID>` (pip-audit) or raise the npm threshold, name the
  # advisory in a comment, and drop the entry once Dependabot
  # (.github/dependabot.yml) opens the bump that clears it.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      # --no-dev: audit what the image ships, not the test tooling. --quiet:
      # uv export echoes the file to stdout as well, which is only log noise.
      # --no-deps: the export is fully pinned, so there is nothing left to
      # resolve. --strict: a package pip-audit could not check fails the job
      # instead of passing silently. pip-audit is pinned like every other
      # installer here. --extra postgres: the image ships asyncpg for the
      # PostgreSQL store, so the audit reads it too. --extra ml: the image
      # ships scikit-learn, numpy and their five dependencies for the estate
      # model, so the audit reads them too.
      - name: pip-audit (locked runtime dependencies)
        run: |
          uv export --frozen --quiet --format requirements-txt --no-hashes --no-emit-project \
            --no-dev --extra postgres --extra ml -o "${RUNNER_TEMP}/requirements.txt"
          uvx pip-audit==2.10.1 -r "${RUNNER_TEMP}/requirements.txt" --no-deps --strict

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Production dependencies only (--omit=dev): the vite/vitest advisories
      # are build-time and their fixes are major bumps. High and critical fail
      # the job. react-router 6.x carries a known moderate advisory (open
      # redirect through a backslash in <Link>) whose fix is 7.x, so moderate
      # is reported but does not block. The audit reads package-lock.json and
      # needs no install.
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
