id: m5-cryptomining-stratum-pool
name: "Unauthorized cryptominer checking in to a Stratum pool"
version: 1
tier: medium
story: |
  Workstation 10.0.0.88 resolves pool.xmr-eu.example, then opens a TCP session
  to 45.9.148.99:3333 and re-opens it every ~2 minutes for the next 50
  minutes. Suricata fires one ET POLICY rule on the Stratum handshake; the
  captured payload is the miner's own login frame — a JSON-RPC
  `mining.subscribe` naming the client as XMRig/6.21.0. Each check-in is a
  short, near-identical exchange: ~1.2 KB up (share submission), ~0.9 KB down
  (new job). The cadence is a keepalive, not a poll: 25 connections at a
  measured mean interval of 124.0s with 6.6s of standard deviation.
attack:
  - T1496      # Resource Hijacking
  - T1571      # Non-Standard Port
sigma_refs: []

ground_truth:
  verdict: true_positive
  confidence_min: 0.65
  required_citation_kinds:
    - typed_path             # rule.name / payload_printable: mining.subscribe + XMRig
    - prefetch_pivot         # zeek.dns: the pool FQDN resolved seconds earlier
    - prefetch_pivot         # zeek.conn: the measured check-in cadence
  expected_actions:
    - kind: escalate
    - kind: block_indicator
      target_field: destination.ip
    - kind: isolate
      target_field: source.ip
  expected_field_reconciliation: false

# The hunt journey: cadence alone is NOT the finding — b1 and b7 both produce
# regular or near-regular external HTTPS from an internal host. The objective
# therefore asks for the protocol evidence behind any flagged pair, which is
# where the Stratum frame and the pool FQDN live.
hunt_journey:
  objective: >-
    Hunt for internal hosts holding a repeating, machine-timed connection to
    an external service on a non-standard port. Use t_beacon_profile to
    measure cadence rather than eyeballing it, then establish what protocol
    is actually running over any flagged pair — a regular cadence on its own
    is also what update pollers and telemetry agents produce.
  expected_cited_event_ids:
    - logs-synth-zeek-conn        # the raw check-ins the cadence sweep measures + cites
    - logs-synth-zeek-dns         # the mining-pool FQDN that names the destination
  expected_promoted_verdict: true_positive

events:
  - index: logs-synth-suricata-alert
    time_offset_seconds: 0
    is_triage_target: true
    fields:
      "@timestamp": "{{ run_time }}"
      event.dataset: suricata.alert
      event.module: suricata
      event.kind: alert
      event.category: [network, intrusion_detection]
      event.action: allowed
      event.severity: 2
      source.ip: "10.0.0.88"
      source.port: 49384
      destination.ip: "45.9.148.99"
      destination.port: 3333
      network.transport: tcp
      network.community_id: "{{ community_id(source.ip, source.port, destination.ip, destination.port, 'tcp') }}"
      rule.name: "ET POLICY Cryptocurrency Miner Checkin - Stratum Protocol"
      rule.category: "Potential Corporate Privacy Violation"
      rule.signature: "2024792"  # illustrative SID — ET POLICY coin-miner family
      # Real Security Onion shape: Suricata rule metadata rides rule.metadata
      # (single-element-list values) and the classtype rides the EVE message
      # JSON as alert.category — SoAlert reads both from there, and a flat
      # top-level copy is invisible to the typed parse.
      rule.metadata:
        signature_severity: ["Minor"]
      message: '{"alert": {"category": "policy-violation"}, "payload_printable": "{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"mining.subscribe\",\"params\":[\"XMRig/6.21.0\",null,\"pool.xmr-eu.example\",3333]}"}'
      observer.name: "so-sensor-1"
      synth.scenario_id: m5-cryptomining-stratum-pool
      synth.scenario_version: 1

  # The name behind the address. Resolved through the corporate resolver
  # immediately before the first check-in — the miner is configured with a
  # pool hostname, not a bare IP.
  - index: logs-synth-zeek-dns
    time_offset_seconds: -2884
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time | offset_seconds(-2884) }}"
      event.dataset: zeek.dns
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.88"
      source.port: 55310
      destination.ip: "10.0.0.1"
      destination.port: 53
      network.transport: udp
      zeek.dns.query: "pool.xmr-eu.example"
      zeek.dns.qtype_name: "A"
      zeek.dns.rcode_name: "NOERROR"
      zeek.dns.answers: ["45.9.148.99"]
      zeek.dns.TTLs: [120]
      synth.scenario_id: m5-cryptomining-stratum-pool

  - index: logs-synth-zeek-conn-summary
    time_offset_seconds: -2884
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time | offset_seconds(-2884) }}"
      event.dataset: zeek.conn_summary
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.88"
      destination.ip: "45.9.148.99"
      destination.port: 3333
      synth.beacon_profile:
        connection_count: 25
        window_seconds: 2976
        mean_interval_seconds: 124.0
        interval_stddev_seconds: 6.6
        interval_similarity: 0.94
        mean_orig_bytes: 1219
        mean_resp_bytes: 918
        orig_bytes_cv: 0.02
        resp_bytes_cv: 0.03
        destination_port_class: "non-standard"
        destination_first_seen_days_ago: 0
      synth.scenario_id: m5-cryptomining-stratum-pool

  # The raw check-ins the cadence sweep actually measures. FIDELITY, not
  # tuning: a Stratum client holds a keepalive against the pool and
  # re-subscribes on every dropped session, so ~2 minutes over ~50 minutes IS
  # 25 connections. t_beacon_profile (soc_ai/tools/analytics.py) aggregates
  # RAW event.dataset:zeek.conn rows per src->dst pair and needs >= min_events
  # (default 8) timestamps with inter-arrival cv <= 0.15 (_CV_PERIODIC) to
  # call a pair "periodic"; a single row or a pre-aggregated summary doc is
  # invisible to it (the defect m1 shipped with for months). Measured over
  # these rows (24 here plus the alert-matched row at t=0): mean 124.00s,
