rubric_notes: |
  Medium TP, and deliberately one where the alert's own classification argues
  the other way. The classtype is `policy-violation` and the severity is
  Minor, because Emerging Threats files coin-mining under policy rather than
  malware. That is a routing hint, not a verdict: an unauthorized miner on a
  corporate endpoint is unauthorized code execution with an attacker-chosen
  payload and an attacker-controlled channel, and it is scored here as
  true_positive. A system that reads `policy-violation` as "benign by
  category" fails this scenario, and that failure mode is the point of it —
  no other scenario in the catalogue tests deference to the rule author's
  classification.

  The evidence is layered so no single arm carries it:
  (1) Protocol identity — the alert payload is the miner's own JSON-RPC
      login frame, naming both the method (`mining.subscribe`) and the client
      (`XMRig/6.21.0`). This rides in the EVE message JSON as
      `payload_printable`, where SoAlert reads it, so the citation resolves
      on the alert without a pivot.
  (2) Destination identity — zeek.dns shows the pool FQDN resolved through
      the corporate resolver five seconds before the first check-in, so the
      address is not incidental CDN space.
  (3) Behaviour — 25 raw zeek.conn rows at a measured mean of 124.0s
      (cv 0.053) with near-constant byte counts in both directions.

  Cadence is the WEAKEST of the three and must not be the whole finding:
  b1-cdn-update-beacon polls even more regularly than this and is benign.
  The pair (protocol frame + pool FQDN) is what separates them.

  Fidelity note: the destination is a globally routable address rather than
  an RFC 5737 documentation address, and it has to be. Both t_beacon_profile
  and t_first_seen drop non-globally-routable destinations — server-side by
  CIDR and again client-side via `is_internal_ip`, which treats TEST-NET /
  documentation ranges as internal. A documentation address here would render
  perfectly and be invisible to the very sweep this scenario exists to
  exercise. Same reason m1 uses 104.18.42.69 and b1 uses 151.101.65.67.
