<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker></defs>
<rect width="1600" height="760" fill="#0d1117"/>
<text x="32" y="40" font-size="22" font-weight="700" fill="#e6edf3">How hunting flows: analytic, hit, lead, hunt, investigation</text>
<text x="32" y="60" font-size="13" fill="#8b949e">Left to right is the pipeline. Each box states what the thing is in one sentence. Blue: the flow. Purple: the verdict path. Green: a loop back to observations. Amber: what waits on you.</text>
<rect x="32" y="92" width="280" height="228" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="48" y="120" font-size="18" font-weight="700" fill="#e6edf3">Analytic</text>
<text x="296" y="119" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="end" letter-spacing="1">RUNS</text>
<text x="48" y="142" font-size="13" font-weight="600" fill="#e6edf3">One detection logic, as YAML.</text>
<text x="48" y="164" font-size="12.5" fill="#8b949e">Runs on every sweep over the grid.</text>
<text x="48" y="181" font-size="12.5" fill="#e6edf3">live: its hits count and form leads.</text>
<text x="48" y="198" font-size="12.5" fill="#e6edf3">shadow: its hits are recorded and shown.</text>
<text x="48" y="215" font-size="12.5" fill="#e6edf3">It raises nothing until you approve it.</text>
<text x="48" y="232" font-size="12.5" fill="#8b949e">candidate → shadow → live → retired</text>
<text x="48" y="249" font-size="12.5" fill="#8b949e">Screen: Hunts › Analytics tab.</text>
<rect x="360" y="92" width="280" height="228" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="376" y="120" font-size="18" font-weight="700" fill="#e6edf3">Hit</text>
<text x="624" y="119" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="end" letter-spacing="1">FOUND</text>
<text x="376" y="142" font-size="13" font-weight="600" fill="#e6edf3">One thing one analytic found</text>
<text x="376" y="160" font-size="13" font-weight="600" fill="#e6edf3">on one entity.</text>
<text x="376" y="182" font-size="12.5" fill="#8b949e">An observation with documents behind it.</text>
<text x="376" y="199" font-size="12.5" fill="#e6edf3">A live hit counts. A shadow hit waits</text>
<text x="376" y="216" font-size="12.5" fill="#e6edf3">for you: read it, then approve or</text>
<text x="376" y="233" font-size="12.5" fill="#e6edf3">reject the analytic that wrote it.</text>
<text x="376" y="250" font-size="12.5" fill="#8b949e">Alert verdicts and hunt findings write</text>
<text x="376" y="267" font-size="12.5" fill="#8b949e">observations too, into the same table.</text>
<text x="376" y="284" font-size="12.5" fill="#8b949e">Screen: Hunts › Analytic hits.</text>
<rect x="688" y="92" width="280" height="228" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="704" y="120" font-size="18" font-weight="700" fill="#e6edf3">Lead</text>
<text x="952" y="119" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="end" letter-spacing="1">DECIDE</text>
<text x="704" y="142" font-size="13" font-weight="600" fill="#e6edf3">Observations on one entity that</text>
<text x="704" y="160" font-size="13" font-weight="600" fill="#e6edf3">are worth one decision.</text>
<text x="704" y="182" font-size="12.5" fill="#8b949e">Forms at weight 0.85 over 2 types, or</text>
<text x="704" y="199" font-size="12.5" fill="#8b949e">on a finding with no benign baseline,</text>
<text x="704" y="216" font-size="12.5" fill="#8b949e">or on one type that repeats.</text>
<text x="704" y="233" font-size="12.5" fill="#e6edf3">Its hunt starts on its own. You decide</text>
<text x="704" y="250" font-size="12.5" fill="#e6edf3">after: Dismiss, or Promote.</text>
<text x="704" y="267" font-size="12.5" fill="#8b949e">Related leads: same analytic, address</text>
<text x="704" y="284" font-size="12.5" fill="#8b949e">or technique in the last 7 days.</text>
<text x="704" y="301" font-size="12.5" fill="#8b949e">Screen: Hunts › Leads, the lead page.</text>
<rect x="1016" y="92" width="280" height="228" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="1032" y="120" font-size="18" font-weight="700" fill="#e6edf3">Hunt</text>
<text x="1280" y="119" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="end" letter-spacing="1">RUN</text>
<text x="1032" y="142" font-size="13" font-weight="600" fill="#e6edf3">One agent run with an objective.</text>
<text x="1032" y="164" font-size="12.5" fill="#8b949e">Started by a lead, a schedule or you.</text>
<text x="1032" y="181" font-size="12.5" fill="#e6edf3">Ends in findings and a narrative.</text>
<text x="1032" y="198" font-size="12.5" fill="#e6edf3">It gives findings, not a verdict.</text>
<text x="1032" y="215" font-size="12.5" fill="#8b949e">A finding names an entity and cites</text>
<text x="1032" y="232" font-size="12.5" fill="#8b949e">documents, or names a gap.</text>
<text x="1032" y="249" font-size="12.5" fill="#8b949e">Screen: Hunts › Hunts, the hunt page.</text>
<rect x="1344" y="92" width="224" height="228" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
<text x="1360" y="120" font-size="18" font-weight="700" fill="#e6edf3">Investigation</text>
<text x="1552" y="119" font-size="11" font-weight="700" fill="#a371f7" text-anchor="end" letter-spacing="1">VERDICT</text>
<text x="1360" y="142" font-size="13" font-weight="600" fill="#e6edf3">One agent run that ends</text>
<text x="1360" y="160" font-size="13" font-weight="600" fill="#e6edf3">in a verdict.</text>
<text x="1360" y="182" font-size="12.5" fill="#8b949e">true positive · false positive ·</text>
<text x="1360" y="199" font-size="12.5" fill="#8b949e">needs more info, with confidence.</text>
<text x="1360" y="216" font-size="12.5" fill="#e6edf3">Its subject is one alert, or one</text>
<text x="1360" y="233" font-size="12.5" fill="#e6edf3">hunt with all its findings.</text>
<text x="1360" y="250" font-size="12.5" fill="#8b949e">Triage is the run. This is its record.</text>
<text x="1360" y="267" font-size="12.5" fill="#8b949e">Screen: Investigations.</text>
<path d="M 312,187 L 360,187" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="336" y="178" font-size="12" fill="#58a6ff" text-anchor="middle">finds</text>
<path d="M 640,187 L 688,187" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="664" y="178" font-size="12" fill="#58a6ff" text-anchor="middle">forms</text>
<path d="M 968,187 L 1016,187" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="992" y="178" font-size="12" fill="#58a6ff" text-anchor="middle">Hunt</text>
<path d="M 1296,187 L 1344,187" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="1320" y="176" font-size="12" fill="#58a6ff" text-anchor="middle">Promote</text>
<path d="M 828,92 L 828,80 L 1456,80 L 1456,92" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="1142" y="77" font-size="12" fill="#58a6ff" text-anchor="middle">Promote a lead</text>
<rect x="32" y="340" width="280" height="120" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="48" y="368" font-size="18" font-weight="700" fill="#e6edf3">Alert</text>
<text x="296" y="367" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="end" letter-spacing="1">INPUT</text>
<text x="48" y="390" font-size="13" font-weight="600" fill="#e6edf3">A detection the grid raised.</text>
<text x="48" y="412" font-size="12.5" fill="#8b949e">Suricata · Sigma · notice.</text>
<text x="48" y="429" font-size="12.5" fill="#e6edf3">soc-ai investigates it. The verdict</text>
<text x="48" y="446" font-size="12.5" fill="#e6edf3">writes an observation (TP 1.0, NMI 0.5).</text>
<path d="M 312,400 L 1456,400 L 1456,320" fill="none" stroke="#a371f7" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="900" y="391" font-size="12" fill="#a371f7" text-anchor="middle">investigate</text>
<path d="M 500,340 L 500,320" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="488" y="336" font-size="12" fill="#3fb950" text-anchor="end">a verdict writes an observation</text>
<path d="M 1156,320 L 1156,480 L 560,480 L 560,320" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="860" y="496" font-size="12" fill="#3fb950" text-anchor="middle">a threat finding writes an observation (0.7)</text>
<path d="M 1236,320 L 1236,530 L 336,530 L 336,250 L 312,250" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="790" y="546" font-size="12" fill="#3fb950" text-anchor="middle">draft an analytic from a finding (candidate)</text>
<rect x="32" y="570" width="760" height="160" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="48" y="598" font-size="15" font-weight="700" fill="#d29922">What waits on you (the Needs-you strip)</text>
<text x="48" y="624" font-size="12.5" fill="#e6edf3">Unread shadow hits: read the evidence, then approve or reject the analytic.</text>
<text x="48" y="646" font-size="12.5" fill="#e6edf3">Leads that need a decision: Hunted, with the hunt's outcome. Dismiss or Promote.</text>
<text x="48" y="668" font-size="12.5" fill="#8b949e">Nothing else needs you. Live hits count on their own. A new lead starts its own hunt.</text>
<text x="48" y="690" font-size="12.5" fill="#8b949e">The sidebar badge and the strip show the same count. The bell lists the items.</text>
<rect x="816" y="570" width="752" height="160" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="832" y="598" font-size="15" font-weight="700" fill="#e6edf3">One word per thing</text>
<text x="832" y="624" font-size="12.5" fill="#8b949e">hit = one observation an analytic wrote. The lead page and the host page call it an observation too.</text>
<text x="832" y="646" font-size="12.5" fill="#8b949e">type = the kind of observation or hunt. Storage keeps the column name kind; the screen says type.</text>
<text x="832" y="668" font-size="12.5" fill="#8b949e">Manual · Schedule · Lead = who started a hunt. The catalog sweep starts none; it writes observations.</text>
<text x="832" y="690" font-size="12.5" fill="#8b949e">Investigate, triage, investigation = one thing. The run and its record.</text>
</svg>