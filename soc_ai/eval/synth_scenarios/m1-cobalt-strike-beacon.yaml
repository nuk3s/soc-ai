id: m1-cobalt-strike-beacon
name: "Cobalt Strike Malleable C2 with JA3 pair + beacon jitter"
version: 1
tier: medium
story: |
  Workstation 10.0.0.115 beacons to a CDN-fronted HTTPS host. A single ET
  HUNTING rule fires (no commodity blocklist match — the destination is
  fronted). The decisive evidence is in Zeek SSL: JA3
  a0e9f5d64349fb13191bc781f81f42e1 (Cobalt Strike Win10 client default) +
  JA3S b742b407517bac9536a77a7b0fee28e9 (CS team server default). Conn-log
  shows regular ~60s ± 6s jitter intervals over 4 hours with nearly constant
  packet sizes — RITA-style beacon profile. The raw zeek.conn rows below
  carry the trailing ~30 minutes of that window (31 check-ins); the
  zeek.conn_summary doc is the 4-hour aggregate.
attack:
  - T1071.001  # Application Layer Protocol: Web Protocols
  - T1102.002  # Web Service: Bidirectional Communication
  - T1571      # Non-Standard Port (sometimes)
sigma_refs:
  - 7090adee-82e2-4269-bd59-80691e7c6338  # Cobalt Strike JA3 (sigmahq)

ground_truth:
  verdict: true_positive
  confidence_min: 0.70
  required_citation_kinds:
    - prefetch_pivot         # Zeek SSL JA3 pair
    - typed_path             # rule.name (ET HUNTING)
    - prefetch_pivot         # conn.log beacon profile
  expected_actions:
    - kind: escalate
    - kind: isolate
      target_field: source.ip
  expected_field_reconciliation: false

# What a correct hunt JOURNEY looks like: run the objective, surface a
# finding that cites the decisive events (ids are event `index` values),
# promote it, land the verdict. The objective describes only the BEHAVIOUR
# to hunt for — the b1 benign twin tells the same periodic-HTTPS story (its
# alert + conn_summary present an even more regular cadence), so a hunt
# that concludes on periodicity alone, without the TLS pivot, measures as
# obedience rather than discrimination.
hunt_journey:
  objective: >-
    Hunt for internal hosts beaconing to external HTTPS services on a
    regular cadence with near-constant transfer sizes. Use t_beacon_profile
    to measure cadence and t_first_seen for novel destinations, then pivot
    into the TLS metadata for any flagged pair before concluding — a routine
    software update check-in can look identical on cadence alone.
  expected_cited_event_ids:
    - logs-synth-zeek-conn  # the raw check-ins the cadence tool measures + cites (sample_ids)
    - logs-synth-zeek-ssl   # the TLS evidence that separates this from b1
  expected_promoted_verdict: true_positive

events:
  - index: logs-synth-suricata-alert
    time_offset_seconds: 0
    is_triage_target: true
    fields:
      "@timestamp": "{{ run_time }}"
      event.dataset: suricata.alert
      event.module: suricata
      event.kind: alert
      event.category: [network, intrusion_detection]
      event.action: allowed
      event.severity: 2
      source.ip: "10.0.0.115"
      source.port: 51844
      destination.ip: "104.18.42.69"  # Cloudflare-fronted
      destination.port: 443
      network.transport: tcp
      network.protocol: ssl
      network.community_id: "{{ community_id(source.ip, source.port, destination.ip, destination.port, 'tcp') }}"
      rule.name: "ET HUNTING Possible Cobalt Strike Extra Whitespace HTTP Response"
      rule.category: "Potentially Bad Traffic"
      rule.signature: "2029425"
      # Real Security Onion shape: Suricata rule metadata rides rule.metadata
      # (single-element-list values) and the classtype rides the EVE message
      # JSON as alert.category — SoAlert reads both from there, and a flat
      # top-level copy is invisible to the typed parse.
      rule.metadata:
        signature_severity: ["Minor"]
      message: '{"alert": {"category": "bad-unknown"}}'
      observer.name: "so-sensor-1"
      synth.scenario_id: m1-cobalt-strike-beacon
      synth.scenario_version: 1

  - index: logs-synth-zeek-ssl
    time_offset_seconds: 0
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time }}"
      event.dataset: zeek.ssl
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.115"
      source.port: 51844
      destination.ip: "104.18.42.69"
      destination.port: 443
      network.community_id: "{{ same_as_triage }}"
      zeek.ssl.version: "TLSv12"
      zeek.ssl.ja3: "a0e9f5d64349fb13191bc781f81f42e1"
      zeek.ssl.ja3s: "b742b407517bac9536a77a7b0fee28e9"
      zeek.ssl.server_name: "static.example-cdn.com"
      zeek.ssl.established: true
      synth.scenario_id: m1-cobalt-strike-beacon

  # KEPT for the single-alert triage path: the pre-aggregated 4-hour profile
  # a triage pivot can cite (rubric: "conn.log beacon profile"). The hunt
  # path does NOT rely on it — t_beacon_profile only measures raw zeek.conn
  # rows (the check-ins planted below).
  - index: logs-synth-zeek-conn-beacon-summary
    time_offset_seconds: -300
    is_triage_target: false
    fields:
      "@timestamp": "{{ run_time | offset_seconds(-300) }}"
      event.dataset: zeek.conn_summary  # aggregated/derived
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.115"
      destination.ip: "104.18.42.69"
      destination.port: 443
      network.community_id_pattern: "{{ same_as_triage }}"
      synth.beacon_profile:
        connection_count: 240
        window_seconds: 14400
        mean_interval_seconds: 60.1
        interval_stddev_seconds: 5.8
        interval_similarity: 0.95  # RITA-style score
        mean_orig_bytes: 442
        mean_resp_bytes: 1188
        orig_bytes_cv: 0.04
        resp_bytes_cv: 0.06
      synth.scenario_id: m1-cobalt-strike-beacon

  # The raw beacon check-ins — FIDELITY, not tuning. The original scenario
  # encoded the cadence as the one conn_summary doc above plus a single raw
  # zeek.conn row, and the first end-to-end hunt-journey run died at
  # FINDING_NOT_PROMOTABLE because t_beacon_profile (soc_ai/tools/analytics.py)
  # measures cadence from RAW event.dataset:zeek.conn rows: it needs >=
  # min_events (8) timestamps per src->dst pair and an inter-arrival
  # cv = stdev/mean <= 0.4 (_CV_MAX) to flag at all, <= 0.15 (_CV_PERIODIC)
  # to call the pair "periodic". One connection has no inter-arrival profile —
  # but a real Cobalt Strike beacon at ~60s over 30+ minutes produces dozens
  # of connections, so a single-row "beacon" was under-specifying the attack
  # the scenario claims to represent (the 2026-05-29 strategic review warns
  # against tuning scenarios to pass; making the fixture match the attack is
  # the opposite). These 30 rows + the t=0 row below span ~30 minutes at a
  # jittered ~60s cadence: measured mean gap 60.30s, stdev 5.61s, cv 0.093 —
  # "periodic" with margin, matching the story's ~60s ± 6s jitter. Each
  # check-in is its own TCP connection (own ephemeral port + community_id),
  # which is exactly why the tool aggregates by ip pair, not flow.
  - index: logs-synth-zeek-conn
    time_offset_seconds: -1809
    fields: &m1_beacon_conn
      "@timestamp": "{{ run_time | offset_seconds(-1809) }}"
      event.dataset: zeek.conn
      event.module: zeek
      event.kind: event
      source.ip: "10.0.0.115"
      source.port: 51663
      destination.ip: "104.18.42.69"
      destination.port: 443
      network.transport: tcp
      network.community_id: "{{ community_id(source.ip, source.port, destination.ip, destination.port, 'tcp') }}"
      zeek.conn.state: "SF"
      zeek.conn.history: "ShAdfFa"
      zeek.conn.duration: 0.31
      zeek.conn.orig_bytes: 442
      zeek.conn.resp_bytes: 1173
      zeek.conn.local_orig: true
      zeek.conn.local_resp: false
      zeek.conn.service: "ssl"
      synth.scenario_id: m1-cobalt-strike-beacon
